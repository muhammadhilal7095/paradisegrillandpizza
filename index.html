<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Google Tag Manager (GTM-5SRJ6TMJ) and the Google Ads tag (AW-18556518542), loaded only after the visitor accepts cookies
      (src/components/CookieBanner.tsx). Until then consent stays "denied" and no Google script is fetched,
      so no Google cookie is set. The purchase conversion fires on /checkout/success.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", { ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied", analytics_storage: "denied" });
      gtag("js", new Date());
      gtag("config", "AW-18556518542");
      window.paradiseConsent = function (choice) {
        try {
          localStorage.setItem("paradise-cookie-consent", choice);
        } catch (e) {}
        if (choice !== "granted") return;
        gtag("consent", "update", { ad_storage: "granted", ad_user_data: "granted", ad_personalization: "granted", analytics_storage: "granted" });
        if (document.getElementById("gtm-js")) return;
        // Google Tag Manager container (gtm.js), as in Tag Manager's install snippet.
        dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var gtm = document.createElement("script");
        gtm.id = "gtm-js";
        gtm.async = true;
        gtm.src = "https://www.googletagmanager.com/gtm.js?id=GTM-5SRJ6TMJ";
        document.head.appendChild(gtm);
        // Google Ads tag, which sends the purchase conversion from /checkout/success.
        var ads = document.createElement("script");
        ads.id = "gtag-js";
        ads.async = true;
        ads.src = "https://www.googletagmanager.com/gtag/js?id=AW-18556518542";
        document.head.appendChild(ads);
      };
      try {
        if (localStorage.getItem("paradise-cookie-consent") === "granted") window.paradiseConsent("granted");
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Paradise Grill and Pizza | Pizza, Peri Peri, Kebabs & Curries</title>
    <meta name="description" content="Stone-baked pizza, flame-grilled peri peri chicken, kebabs, burgers and curries. Order online for collection or delivery." />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/logo-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/brand/logo-192.png" />
    <link rel="apple-touch-icon" href="/images/brand/logo-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Caveat:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
